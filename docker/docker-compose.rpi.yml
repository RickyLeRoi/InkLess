# docker/docker-compose.rpi.yml
#
# Runs on the hardware node. This node is never reachable from the internet: it dials
# the backend on the LAN and pushes the stream outbound, nothing else.
#
# Every value comes from the untracked .env. Compose interpolates ${...} at parse time
# from the file given by --env-file, so run this from the repository root:
#
#   docker compose --env-file .env -f docker/docker-compose.rpi.yml up -d

services:
  daemon:
    image: ghcr.io/rickyleroi/inkless-hardware:latest
    build:
      context: ..
      dockerfile: docker/hardware.Dockerfile
    restart: unless-stopped
    # BACKEND_URL, PRINTER_KIND, RECORDER_KIND, UPLOADER_KIND and the storage keys are
    # injected from here, not restated below.
    env_file: ../.env
    devices:
      # python-escpos opens the printer via libusb (pyusb), which scans the
      # whole USB tree for the vendor/product match — not a fixed node like
      # /dev/usb/lp0, which belongs to a different kernel driver entirely.
      - "/dev/bus/usb:/dev/bus/usb"
      - "${WEBCAM_DEVICE:-/dev/video0}:${WEBCAM_DEVICE:-/dev/video0}"
    # The udev rule in INSTALL.md grants the printer's device node to the
    # host's plugdev group, and /dev/video0 is normally owned by the host's
    # video group. Neither name means anything inside the container, but
    # the numeric GID does — so both host GIDs join the container process.
    # Unverified against real hardware; see INSTALL.md for how to find them.
    group_add:
      - "${PRINTER_GROUP_GID}"
      - "${WEBCAM_GROUP_GID}"
    volumes:
      - clips:/tmp/inkless-clips
      - overlay:/shared
    security_opt:
      - no-new-privileges:true

  streamer:
    image: linuxserver/ffmpeg:latest
    restart: unless-stopped
    # Opt-in: an empty STREAM_INGEST_URL would leave ffmpeg with a truncated command, so
    # the service starts only on `--profile stream`, never by accident.
    profiles: ["stream"]
    env_file: ../.env
    devices:
      - "${WEBCAM_DEVICE:-/dev/video0}:${WEBCAM_DEVICE:-/dev/video0}"
    volumes:
      - overlay:/shared:ro
    # drawtext with reload=1 re-reads the overlay file every frame, so the handle the
    # daemon just wrote appears over the live shot without restarting the encoder.
    command: >
      -f v4l2 -framerate 25 -video_size 1280x720 -i ${WEBCAM_DEVICE:-/dev/video0}
      -vf "drawtext=textfile=/shared/current_user.txt:reload=1:fontcolor=white:fontsize=28:x=24:y=h-48"
      -c:v h264_v4l2m2m -b:v 2500k -maxrate 2500k -bufsize 5000k
      -f flv ${STREAM_INGEST_URL}
    depends_on:
      - daemon
    security_opt:
      - no-new-privileges:true

volumes:
  clips:
  overlay:
