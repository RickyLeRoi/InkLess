# docker/docker-compose.rpi.yml
#
# Runs on the Raspberry Pi 4 (192.168.1.254). This node is never reachable from the
# internet: it dials the backend on the LAN and pushes RTMP outbound, nothing else.

services:
  daemon:
    build:
      context: ..
      dockerfile: docker/hardware.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      BACKEND_URL: http://192.168.1.248:3000
      PRINTER_KIND: escpos
      RECORDER_KIND: ffmpeg
      UPLOADER_KIND: s3
    devices:
      # Exactly the two devices needed. Never `privileged: true`.
      - "/dev/usb/lp0:/dev/usb/lp0"
      - "/dev/video0:/dev/video0"
    volumes:
      - clips:/tmp/inkless-clips
      - overlay:/shared
    security_opt:
      - no-new-privileges:true

  streamer:
    image: linuxserver/ffmpeg:latest
    restart: unless-stopped
    env_file: ../.env
    devices:
      - "/dev/video0:/dev/video0"
    volumes:
      - overlay:/shared:ro
    # drawtext with reload=1 re-reads the overlay file every frame, so the handle the
    # daemon just wrote appears over the live shot without restarting the encoder.
    command: >
      -f v4l2 -framerate 25 -video_size 1280x720 -i /dev/video0
      -vf "drawtext=textfile=/shared/current_user.txt:reload=1:fontcolor=white:fontsize=28:x=24:y=h-48"
      -c:v h264_v4l2m2m -b:v 2500k -maxrate 2500k -bufsize 5000k
      -f flv rtmp://live.twitch.tv/app/${TWITCH_STREAM_KEY}
    depends_on:
      - daemon
    security_opt:
      - no-new-privileges:true

volumes:
  clips:
  overlay:
