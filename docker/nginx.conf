# docker/nginx.conf
#
# The only public entry point. cloudflared dials this container, which serves the built
# frontend and forwards /api to the backend — one origin for the browser, which is why
# CORS never enters the picture in production.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The bundle is text; the tunnel hop is not free.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # 20260831 ++ RG #docker_dns_rebinding
    # proxy_pass with a literal host resolves once at startup and caches the address
    # forever: rebuild the backend container, it comes back on a new IP, and nginx
    # serves 502 until someone reloads it. Going through the embedded Docker resolver
    # with a variable target re-resolves instead.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_origin http://inkless-backend:3000;

    # 20260831 ++ RG #sse_needs_unbuffered_proxy
    # The job page reads this as Server-Sent Events. nginx buffers proxied responses by
    # default, which would hold every event back until the buffer fills — whoever just
    # paid would sit in front of a frozen page while the receipt prints.
    location ~ ^/api/jobs/[^/]+/stream$ {
        proxy_pass $backend_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        # A queued job can wait minutes for the printer; the stream must outlive that.
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass $backend_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints these filenames, so a stale copy can never be the wrong copy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The router is hash-based, so every real navigation already lands on /. This is the
    # net for hand-typed paths and for the day the router stops using the hash.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
