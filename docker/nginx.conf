# docker/nginx.conf
#
# The only public entry point. cloudflared dials this container, which serves the built
# frontend and forwards /api to the backend — one origin for the browser, which is why
# CORS never enters the picture in production.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nothing here needs to advertise what version is running.
    server_tokens off;

    # 20260831 ++ RG #security_headers
    # There were none at all. The bundle carries no inline script and no inline style —
    # Vite emits one external .js and one external .css — so the policy can be strict
    # rather than the usual 'unsafe-inline' surrender, and script-src 'self' is what
    # actually turns an injected <script> into a console error.
    #
    # This matters more than the absence of a known XSS suggests: the admin panel is the
    # same origin as the public board, and it keeps Basic credentials in sessionStorage.
    # Any script that runs here does not steal a session, it steals the password.
    #
    # `always` on every one of them, or nginx drops the header on error responses —
    # which are exactly the ones an attacker is trying to get rendered.
    #
    # media-src is 'self' because the clips are moving onto this origin. A node still
    # configured with UPLOADER_KIND=s3 and an external PUBLIC_CLIPS_URL needs that host
    # added here, or the <video> stays blank with a console error and nothing else.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Redundant next to frame-ancestors, kept for browsers that predate CSP level 2.
    add_header X-Frame-Options "DENY" always;
    #
    # No Strict-Transport-Security here on purpose: nginx only ever sees plain HTTP
    # inside the tunnel, and TLS is terminated at the Cloudflare edge. HSTS belongs
    # there (SSL/TLS -> Edge Certificates -> HSTS), where the browser actually connects.

    # The bundle is text; the tunnel hop is not free.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # 20260831 ++ RG #docker_dns_rebinding
    # proxy_pass with a literal host resolves once at startup and caches the address
    # forever: rebuild the backend container, it comes back on a new IP, and nginx
    # serves 502 until someone reloads it. Going through the embedded Docker resolver
    # with a variable target re-resolves instead.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_origin http://inkless-backend:3000;

    # 20260831 ++ RG #forgeable_client_ip
    # Both proxied locations below restate CF-Connecting-IP. The backend keys its rate
    # limits on it because Cloudflare overwrites it at the edge on every request, which
    # makes it the one address a caller cannot choose — unlike X-Forwarded-For, which
    # every hop appends to and whose first entry the client writes. It would be passed
    # through implicitly anyway; setting it explicitly makes the dependency visible, and
    # nginx omits the header entirely when the variable is empty, so a request that did
    # not come through Cloudflare cannot smuggle one in.

    # 20260831 ++ RG #sse_needs_unbuffered_proxy
    # The job page reads this as Server-Sent Events. nginx buffers proxied responses by
    # default, which would hold every event back until the buffer fills — whoever just
    # paid would sit in front of a frozen page while the receipt prints.
    location ~ ^/api/jobs/[^/]+/stream$ {
        proxy_pass $backend_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        # A queued job can wait minutes for the printer; the stream must outlive that.
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass $backend_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints these filenames, so a stale copy can never be the wrong copy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # 20260831 ++ RG #add_header_does_not_inherit
        # nginx's add_header is replace, not merge: a block that sets any add_header
        # inherits none of the parent's. Without this line the bundle itself would be
        # served with every security header stripped — a lot of nothing traded for a
        # cache directive. CSP is meaningless on a .js response; nosniff is not.
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The router is hash-based, so every real navigation already lands on /. This is the
    # net for hand-typed paths and for the day the router stops using the hash.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
