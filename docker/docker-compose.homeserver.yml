# docker/docker-compose.homeserver.yml
#
# Runs on the home server. Nothing here publishes a port to the internet: cloudflared
# dials out, and the only inbound path is the tunnel.
#
# The tunnel's public hostname must point at http://inkless-frontend:80 — nginx serves the built
# site and forwards /api to the backend, so the browser only ever sees one origin.
#
# Every value comes from the untracked .env.homeserver. Compose interpolates ${...} at
# parse time from the file given by --env-file, so run this from the repository root:
#
#   docker compose --env-file .env.homeserver -f docker/docker-compose.homeserver.yml up -d
#
# 20260831 ** RG #split_env_per_host
# Deliberately not a shared .env: the hardware node reads .env.rpi, which carries no
# payment key, no admin password and no tunnel token.

# 20260831 ++ RG #blast_radius_stops_here
# Every service below carries mem_limit / cpus / pids_limit and a capped log driver.
# This host is not dedicated: paperless, nextcloud, vaultwarden and pihole live on it
# too. Without a ceiling, an OOM here does not take down InkLess, it takes down the
# DNS of the whole house and the password manager with it. The numbers are deliberately
# generous — they are a fence against runaway, not a tuning exercise.

x-inkless: &inkless
    build:
      context: ..
    restart: unless-stopped
    env_file:
      - path: ./.env.inkless
        required: true
    volumes:
      - inkless-data:/app/data
    networks:
      - frontend_net
      - backend_net
      - hw_net
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

services:
  # Service names carry the project prefix on purpose: this file is not always the
  # only compose file on the host, and `backend` is the first name anyone else takes.
  inkless-backend:
    <<: *inkless
    container_name: inkless-backend
    image: ghcr.io/rickyleroi/inkless-backend:latest
    build:
      dockerfile: docker/backend.Dockerfile
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:${PORT:-3000}:${PORT:-3000}"

  inkless-frontend:
    <<: *inkless
    container_name: inkless-frontend
    image: ghcr.io/rickyleroi/inkless-frontend:latest
    build:
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      - inkless-backend

  cloudflared:
    # 20260831 ** RG #pin_third_party_images
    # Was :latest, so `docker compose pull` fetched whatever existed at that moment with
    # nothing to compare it against. The digest is the immutable identity; the tag stays
    # for readability and so Dependabot can offer the next one. Same reasoning as the
    # SHA-pinned GitHub Actions — and this one runs on the network, not in a runner.
    image: cloudflare/cloudflared:latest@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      # Only the frontend. The tunnel has no route to the backend any more, and that is
      # the point: public traffic cannot skip nginx.
      - frontend_net
    depends_on:
      - inkless-frontend
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    # 20260831 RG
    # Deliberately not `internal: true`, tempting as it looks: the backend calls the
    # payment provider and the moderation LLM host from here. What isolates it is that no port is
    # published on this network and nginx is the only other member.
    internal: false
  hw_net:
    driver: bridge

volumes:
  inkless-data:
