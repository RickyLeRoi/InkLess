# docker/docker-compose.homeserver.yml
#
# Runs on the home server. Nothing here publishes a port to the internet: cloudflared
# dials out, and the only inbound path is the tunnel.
#
# The tunnel's public hostname must point at http://inkless-frontend:80 — nginx serves the built
# site and forwards /api to the backend, so the browser only ever sees one origin.
#
# Every value comes from the untracked .env.homeserver. Compose interpolates ${...} at
# parse time from the file given by --env-file, so run this from the repository root:
#
#   docker compose --env-file .env.homeserver -f docker/docker-compose.homeserver.yml up -d
#
# 20260831 ** RG #split_env_per_host
# Deliberately not a shared .env: the hardware node reads .env.rpi, which carries no
# payment key, no admin password and no tunnel token.

services:
  # Service names carry the project prefix on purpose: this file is not always the
  # only compose file on the host, and `backend` is the first name anyone else takes.
  inkless-backend:
    # `image` lets `pull` fetch what CI already built; `build` stays for
    # local iteration (`up -d --build` still works without it).
    image: ghcr.io/rickyleroi/inkless-backend:latest
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    # NODE_ENV, HOST, PORT and every secret are injected from here, not restated below.
    env_file: ../.env.homeserver
    volumes:
      - inkless-data:/app/data
    networks:
      - backend_net
      # Reachable from the hardware node over the LAN, but only on this segment.
      - hw_net
    ports:
      # Bound to one interface on purpose: the hardware node needs it, the internet does
      # not. The default keeps the port on the host until .env says otherwise.
      - "${BACKEND_BIND_IP:-127.0.0.1}:${PORT:-3000}:${PORT:-3000}"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  inkless-frontend:
    image: ghcr.io/rickyleroi/inkless-frontend:latest
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    networks:
      # Faces the tunnel on one side and the backend on the other. It is the only
      # container that sits on both.
      - frontend_net
      - backend_net
    depends_on:
      - inkless-backend
    # No `ports`: nothing on the host reaches this, only cloudflared from frontend_net.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      # Only the frontend. The tunnel has no route to the backend any more, and that is
      # the point: public traffic cannot skip nginx.
      - frontend_net
    depends_on:
      - inkless-frontend
    security_opt:
      - no-new-privileges:true

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    # 20260831 RG
    # Deliberately not `internal: true`, tempting as it looks: the backend calls the
    # payment provider and the moderation LLM host from here. What isolates it is that no port is
    # published on this network and nginx is the only other member.
    internal: false
  hw_net:
    driver: bridge

volumes:
  inkless-data:
