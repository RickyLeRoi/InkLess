# docker/docker-compose.homeserver.yml
#
# Runs on the home server. Nothing here publishes a port to the internet: cloudflared
# dials out, and the only inbound path is the tunnel.
#
# Every value comes from the untracked .env. Compose interpolates ${...} at parse time
# from the file given by --env-file, so run this from the repository root:
#
#   docker compose --env-file .env -f docker/docker-compose.homeserver.yml up -d

services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    # NODE_ENV, HOST, PORT and every secret are injected from here, not restated below.
    env_file: ../.env
    volumes:
      - inkless-data:/app/data
    networks:
      - backend_net
      # Reachable from the hardware node over the LAN, but only on this segment.
      - hw_net
    ports:
      # Bound to one interface on purpose: the hardware node needs it, the internet does
      # not. The default keeps the port on the host until .env says otherwise.
      - "${BACKEND_BIND_IP:-127.0.0.1}:${PORT:-3000}:${PORT:-3000}"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - backend_net
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true

networks:
  backend_net:
    driver: bridge
    internal: false
  hw_net:
    driver: bridge

volumes:
  inkless-data:
