# .github/workflows/docker-hardware.yml
#
# Builds and publishes the hardware-daemon image to GHCR, so it can be
# pulled with `docker compose pull` on either machine that might run it.
#
# Two platforms on purpose: amd64 to test the container on the home server
# or a dev machine, arm64 for the actual target, a Raspberry Pi 4 on a
# 64-bit OS. QEMU emulates arm64 on the (amd64) GitHub runner.

name: docker-hardware

on:
  push:
    branches: [main]
    paths:
      - "hardware/**"
      - "docker/hardware.Dockerfile"
      - ".github/workflows/docker-hardware.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/rickyleroi/inkless-hardware

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHA, not a tag: tags on third-party actions can move (see the
      # 2025 tj-actions/changed-files incident), and this workflow runs with
      # packages:write against GHCR. Comment carries the human-readable version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/hardware.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
