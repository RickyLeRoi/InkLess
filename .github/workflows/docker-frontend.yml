# .github/workflows/docker-frontend.yml
#
# Builds and publishes the frontend image to GHCR, so the home server can
# `docker compose pull` a ready image instead of building it locally.

name: docker-frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "docker/frontend.Dockerfile"
      - "docker/nginx.conf"
      - ".github/workflows/docker-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/rickyleroi/inkless-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      # The home server is amd64 (Dell OptiPlex), so that is the only
      # platform this one needs.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
