# .github/workflows/docker-backend.yml
#
# Builds and publishes the backend image to GHCR, so the home server can
# `docker compose pull` a ready image instead of building it locally.

name: docker-backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker/backend.Dockerfile"
      - ".github/workflows/docker-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/rickyleroi/inkless-backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHA, not a tag: tags on third-party actions can move (see the
      # 2025 tj-actions/changed-files incident), and this workflow runs with
      # packages:write against GHCR. Comment carries the human-readable version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      # The home server is amd64 (Dell OptiPlex), so that is the only
      # platform this one needs.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/backend.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
