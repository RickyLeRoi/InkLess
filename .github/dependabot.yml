# .github/dependabot.yml
#
# Weekly PRs for outdated dependencies across all three modules, plus the GitHub Actions
# used in .github/workflows/. The actions are pinned to commit SHA (see docker-*.yml) so
# Dependabot's PRs there bump the pinned SHA and its version comment together, rather
# than leaving the pin to go stale by hand.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/hardware"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # 20260831 ++ RG #pin_third_party_images
  # The compose files pin cloudflared and linuxserver/ffmpeg to a digest, which is only
  # an improvement while something keeps the digest current — otherwise a pin is just a
  # stale image with extra steps. This is that something. Covers the Dockerfiles in the
  # same directory too.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
